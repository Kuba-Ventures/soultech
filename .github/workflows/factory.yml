name: factory

# Supervised PR factory. Every PR runs two checks:
#   factory-tests  — the Vitest safety net (npm test)
#   factory-review — the supervised reviewer's verdict, turned into a pass/fail GATE
#
# The gate is GREEN only on an explicit APPROVE-LOWRISK verdict. ESCALATE → red. A review
# that never ran (the Claude action self-skips on PRs that touch .github/**) → red, fail-closed.
# So branch protection requiring factory-review means: only low-risk PRs are mergeable without
# a human; everything else needs an admin to look and override.
#
# Auto-merge for the green (low-risk) PRs is still gated behind the repo variable
# FACTORY_AUTOMERGE (unset = off) and is enabled only after a supervised soak.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  factory-tests:
    name: factory-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  factory-review:
    name: factory-review
    needs: factory-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Supervised review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--allowed-tools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*)"'
          prompt: |
            You are the gate for a supervised PR factory. Review pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            The factory-tests job has already passed — this job depends on it.

            Use the **pr-reviewer** subagent defined at .claude/agents/pr-reviewer.md and
            follow its instructions exactly:
              1. Read the `## Merge policy` block in CLAUDE.md to learn this repo's low-risk
                 surfaces and its always-escalate surfaces.
              2. Read the PR diff against the base branch.
              3. Walk the escalation gates and decide APPROVE-LOWRISK or ESCALATE. When in
                 doubt, ESCALATE — this is a paying client's product.

            Then take exactly these actions, IN THIS ORDER:
              1. FIRST, write your decision as a single bare token to a file named
                 `.factory-verdict` in the repository root — either `APPROVE-LOWRISK` or
                 `ESCALATE` and nothing else. This file is how the merge gate is computed, so
                 write it before anything else.
              2. Post your review as a PR comment, ending with the exact VERDICT line
                 (`VERDICT: APPROVE-LOWRISK` or `VERDICT: ESCALATE — <reason>`).
              3. If APPROVE-LOWRISK: add the label `factory:lowrisk` to the PR.
                 If ESCALATE: add the label `factory:escalate` to the PR.

            Do NOT merge the PR under any circumstances.

      - name: Compute merge gate (fail-closed)
        run: |
          # The gate is satisfied ONLY by an explicit APPROVE-LOWRISK verdict written by the
          # reviewer during THIS run. The file lives in the ephemeral runner workspace, so a
          # missing file means the review did not actually run — fail closed.
          if [ ! -f .factory-verdict ]; then
            echo "::error::No .factory-verdict written — the reviewer did not run (e.g. a PR that modifies .github/** which the Claude action skips by design). Failing closed; a human admin must review and override."
            exit 1
          fi
          verdict="$(tr -d '[:space:]' < .factory-verdict)"
          echo "Reviewer verdict: '${verdict}'"
          if [ "$verdict" = "APPROVE-LOWRISK" ]; then
            echo "APPROVE-LOWRISK — low-risk gate satisfied; this PR may merge."
            exit 0
          fi
          echo "::error::Verdict is '${verdict}', not APPROVE-LOWRISK — escalated to a human. This PR will not merge without an admin override."
          exit 1
